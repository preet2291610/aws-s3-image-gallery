<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Image Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#202b3c}
header{background:#172b4d;color:white;padding:25px 8%;text-align:center}
header h1{margin:0;font-size:30px}
main{max-width:1100px;margin:35px auto;padding:20px}
.upload{background:white;padding:25px;border-radius:12px;text-align:center;box-shadow:0 3px 12px #0001}
button{background:#2563eb;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}
button:hover{background:#1748b0}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:30px}
.card{background:white;padding:10px;border-radius:12px;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:190px;object-fit:cover;border-radius:8px}
.card button{background:#dc3545;margin-top:10px;width:100%}
#status{margin-top:15px;color:#2563eb}
</style>
</head>
<body>
<header>
<h1>☁ Cloud Image Gallery</h1>
<p>Upload and manage your images using Amazon S3</p>
</header>

<main>
<section class="upload">
<h2>Upload Your Image</h2>
<form id="uploadForm">
<input type="file" id="image" accept="image/*" required>
<br><br>
<button type="submit">Upload Image</button>
</form>
<p id="status"></p>
</section>

<h2>My Image Collection</h2>
<div id="gallery"></div>
</main>

<script>
async function loadImages(){
const gallery=document.getElementById("gallery");
gallery.innerHTML="Loading images...";

try{
const response=await fetch("/api/images");
if(!response.ok) throw new Error("Could not load images");
const images=await response.json();
gallery.innerHTML="";

if(images.length===0){
gallery.innerHTML="<p>No images uploaded yet.</p>";
return;
}

images.forEach(item=>{
const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.src=item.url;
img.alt="Gallery image";

const del=document.createElement("button");
del.textContent="Delete Image";
del.onclick=()=>deleteImage(item.key);

card.append(img,del);
gallery.appendChild(card);
});
}catch(error){
gallery.textContent="Unable to load images.";
}
}

document.getElementById("uploadForm").onsubmit=async function(e){
e.preventDefault();
const file=document.getElementById("image").files[0];
const status=document.getElementById("status");

if(!file)return;
status.textContent="Uploading...";

const data=new FormData();
data.append("image",file);

try{
const response=await fetch("/api/upload",{method:"POST",body:data});
const result=await response.json();
if(!response.ok)throw new Error(result.error);
status.textContent="Image uploaded successfully!";
this.reset();
loadImages();
}catch(error){
status.textContent=error.message;
}
};

async function deleteImage(key){
if(!confirm("Delete this image?"))return;
const response=await fetch("/api/images/"+encodeURIComponent(key),{method:"DELETE"});
if(response.ok)loadImages();
else alert("Could not delete image.");
}

loadImages();
</script>
</body>
</html>
